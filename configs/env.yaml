# env.yaml - SFC环境核心配置（时间槽版本）
# 对应HIRL-MSFC-CE/hirl_sfc_env.py中的环境初始化与运行参数

# ==============================================
# 1. 路径与文件配置
# ==============================================
paths:
  input_dir: "data/input_dir"
  failure_output_dir: "data/failure"

  # Phase1数据文件
  phase1_requests: "phase1_requests.pkl"
  phase1_events: "phase1_events.pkl"

  # 🔥 新增：时间槽数据文件
  phase1_requests_by_slot: "phase1_requests_by_slot.pkl"
  phase1_events_by_slot: "phase1_events_by_slot.pkl"

  # Phase3数据文件
  phase3_requests: "phase3_requests.pkl"
  phase3_events: "phase3_events.pkl"

  # 🔥 新增：Phase3时间槽数据文件
  phase3_requests_by_slot: "phase3_requests_by_slot.pkl"
  phase3_events_by_slot: "phase3_events_by_slot.pkl"

  # 兼容旧版本
  fallback_requests: "sorted_requests.pkl"
  fallback_events: "event_list.pkl"

# ==============================================
# 2. 网络资源配置
# ==============================================
resources:
  capacities:
    cpu: 80.0         # 节点CPU容量
    memory: 60.0      # 节点内存容量
    bandwidth: 80.0   # 链路带宽容量
  dc_nodes: [1, 2, 3, 4, 5, 6, 7, 8, 11, 13, 14, 17, 18, 19, 20, 21, 23, 24, 27, 28]  # 数据中心节点列表

# ==============================================
# 3. 🔥 时间槽系统配置（新增）
# ==============================================
timeslot:
  # 时间槽基本参数
  delta_t: 0.01                    # 时间槽大小（秒）= 10ms
  max_time_slots: 200000           # 最大时间槽数（可选，防止内存溢出）

  # 请求持续时间配置
  request_duration:
    min_slots: 200                # 最小持续时间（时间槽）= 10s
    max_slots: 1000                # 最大持续时间（时间槽）= 60s
    mean_lifetime: 3               # 平均生存时间（时间间隔数）

  # 时间槽系统开关
  enabled: true                    # 启用时间槽系统
  use_discrete_time: true          # 使用离散时间模拟

# ==============================================
# 4. 环境运行参数
# ==============================================
runtime:
  max_timesteps: 3000              # 最大时间步（T），与self.T保持一致
  max_paths_in_tree: 10            # 树中最大路径数（对应PathManager的max_paths）
  expert_randomness: 0.1           # 专家系统随机性系数

  # 🔥 新增：时间槽相关运行参数
  max_steps_per_episode: 600       # 单个请求最大决策步数
  enable_timeout_detection: true   # 启用超时检测
  timeout_penalty: -300.0          # 超时惩罚

# ==============================================
# 5. 状态与空间配置
# ==============================================
state_space:
  nb_high_level_goals: 28          # 高层目标数量
  nb_low_level_actions: 100        # 低层动作数量（max_paths_in_tree * K_path，K_path从expert获取）
  dim_network: null                # 动态计算：n + n + L + n*K_vnf（n/L/K_vnf从expert获取）
  dim_request: 10                  # 请求特征维度
  state_vector_size: null          # 动态计算：dim_network + dim_request

# ==============================================
# 6. 数据加载与切换配置
# ==============================================
dataset:
  auto_reset_time: true            # 加载新数据集时是否强制重置时间指针（t=0）
  reset_resources_on_switch: true  # 切换数据集时是否重置资源状态
  reset_stats_on_switch: true      # 切换数据集时是否重置统计指标

  # 🔥 新增：时间槽数据加载配置
  use_timeslot_data: true          # 优先使用时间槽数据
  fallback_to_original: true       # 如果时间槽数据不存在，回退到原版

# ==============================================
# 7. 可视化与日志配置
# ==============================================
visualization:
  enable_render: true              # 是否启用可视化
  failure_visualizer:
    auto_layout: true              # 节点位置是否自动布局（无坐标数据时）

logging:
  metrics:
    track_backup_stats: true       # 是否跟踪备份策略统计
    track_resource_usage: true     # 是否跟踪资源使用情况

    # 🔥 新增：时间槽相关日志
    track_timeslot_info: true      # 跟踪时间槽信息
    log_timeslot_jumps: true       # 记录时间槽跳转
    log_request_expiry: true       # 记录请求到期

# ==============================================
# 8. 备份策略配置（集成sfc_backup_system）
# ==============================================
backup_policy:
  enabled: true                    # 是否启用备份策略
  vnf_placement_strategy: "resource_aware"  # VNF放置策略（simple_round_robin/resource_aware）

# ==============================================
# 9. 🔥 资源管理配置（新增）
# ==============================================
resource_management:
  # 资源追踪
  enable_request_level_tracking: true  # 启用请求级别资源追踪
  auto_release_expired: true           # 自动释放过期请求资源

  # 资源检查
  check_before_allocate: true          # 分配前检查资源
  reserve_margin: 0.1                  # 资源预留余量（10%）

# ==============================================
# 10. 🔥 性能优化配置（新增）
# ==============================================
performance:
  # 批量处理
  batch_process_requests: true         # 批量处理同一时间槽的请求
  max_batch_size: 10                   # 最大批量大小

  # 缓存
  enable_path_cache: true              # 启用路径缓存
  cache_size: 1000                     # 缓存大小